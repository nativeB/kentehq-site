server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;
  absolute_redirect off;
  charset_types text/plain text/xml text/css application/javascript application/xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # One address per page for search engines: /index.html and /about.html redirect to / and /about.
  if ($request_uri ~ ^/index(\.html)?(\?.*)?$) { return 301 /$2; }
  if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) { return 301 /$1$2; }
  location = /config.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; try_files $uri =404; }
  # App, admin, API and tokenised (pay/review/reset) paths are never served or indexed on this host.
  location ~ ^/(app|admin|api|pay|review|reset)(/|$) { add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; return 404; }
  location / { try_files $uri $uri.html $uri/ =404; }
}
